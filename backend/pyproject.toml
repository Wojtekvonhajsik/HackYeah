[project]
name = "bezbarier"
version = "0.1.0"
description = "Dostępni.pl - klasyfikacja barier wg potrzeb użytkownika"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Detektory na modelach wizyjnych (opcjonalne - bez nich działa MockDetector)
gemini = ["google-genai>=2.28"]
claude = ["anthropic"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bezbarier"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
